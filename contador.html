<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>CajaFácil Cuba — Contador de Efectivo</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <i class="ti ti-cash-banknote" style="font-size:22px;color:var(--primary)"></i>
  <h1>Contador de Efectivo</h1>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-theme"></button>
</header>

<main class="container">

  <div class="card">
    <div class="grid grid-2">
      <div>
        <label>Moneda</label>
        <select class="input" id="moneda">
          <option value="CUP">CUP</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div>
        <label>Monto esperado en caja (opcional)</label>
        <input class="input" id="esperado" type="number" min="0" step="0.01" placeholder="0">
      </div>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Denominación</th>
          <th>Cantidad</th>
          <th style="text-align:right">Subtotal</th>
        </tr>
      </thead>
      <tbody id="tabla-contador"></tbody>
    </table>

    <div style="margin-top:16px;text-align:right">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Total contado</div>
      <div class="total-display" id="total-contado">0 CUP</div>
    </div>

    <div id="diff-box" style="margin-top:12px;display:none">
      <div class="card" style="margin:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;color:var(--muted)">Diferencia con caja</span>
          <span id="diff-valor" style="font-weight:700"></span>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-success" style="flex:1" id="btn-guardar">
        <i class="ti ti-device-floppy"></i> Guardar conteo
      </button>
      <button class="btn btn-danger" id="btn-borrar">
        <i class="ti ti-eraser"></i> Borrar
      </button>
    </div>
  </div>

  <div class="card">
    <strong style="display:block;margin-bottom:10px">Historial de conteos</strong>
    <div id="historial"></div>
  </div>

</main>

<nav class="nav-bottom">
  <a href="index.html"><i class="ti ti-shopping-cart"></i>Vender</a>
  <a href="inventario.html"><i class="ti ti-box"></i>Inventario</a>
  <a href="contador.html"><i class="ti ti-cash-banknote"></i>Contador</a>
  <a href="caja.html"><i class="ti ti-wallet"></i>Caja</a>
  <a href="reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a>
  <a href="ajustes.html"><i class="ti ti-settings"></i>Ajustes</a>
</nav>

<script src="js/app.js"></script>
<script src="js/contador.js"></script>
</body>
</html>
