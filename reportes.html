<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>CajaFácil Cuba — Reportes</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <i class="ti ti-chart-bar" style="font-size:22px;color:var(--primary)"></i>
  <h1>Reportes</h1>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-theme"></button>
</header>

<main class="container">
  <div class="card">
    <div class="grid grid-3">
      <div>
        <div style="font-size:12px;color:var(--muted)">VENTAS HOY</div>
        <div style="font-size:20px;font-weight:700" id="r-hoy">0</div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--muted)">TOTAL HISTÓRICO</div>
        <div style="font-size:20px;font-weight:700" id="r-total">0</div>
      </div>
      <div>
        <div style="font-size:12px;color:var(--muted)">TRANSACCIONES</div>
        <div style="font-size:20px;font-weight:700" id="r-count">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Historial de ventas</strong>
      <button class="btn" id="btn-export"><i class="ti ti-download"></i> CSV</button>
    </div>
    <div id="historial-ventas"></div>
  </div>
</main>

<nav class="nav-bottom">
  <a href="index.html"><i class="ti ti-shopping-cart"></i>Vender</a>
  <a href="inventario.html"><i class="ti ti-box"></i>Inventario</a>
  <a href="contador.html"><i class="ti ti-cash-banknote"></i>Contador</a>
  <a href="caja.html"><i class="ti ti-wallet"></i>Caja</a>
  <a href="reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a>
  <a href="ajustes.html"><i class="ti ti-settings"></i>Ajustes</a>
</nav>

<script src="js/app.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
