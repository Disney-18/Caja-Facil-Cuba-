<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>CajaFácil Cuba — Inventario</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <i class="ti ti-box" style="font-size:22px;color:var(--primary)"></i>
  <h1>Inventario</h1>
  <div class="spacer"></div>
  <a href="negocios.html" id="negocio-activo" class="negocio-btn"></a>
  <button class="icon-btn" id="btn-theme"></button>
</header>

<main class="container">

  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn btn-primary" style="flex:1;min-width:120px" id="btn-nuevo-producto">
      <i class="ti ti-plus"></i> Producto
    </button>
    <button class="btn" style="flex:1;min-width:120px" id="btn-nueva-categoria">
      <i class="ti ti-tag"></i> Categoría
    </button>
    <button class="btn" style="flex:1;min-width:120px" id="btn-importar">
      <i class="ti ti-upload"></i> Importar
    </button>
    <button class="btn" style="flex:1;min-width:120px" id="btn-exportar-inv">
      <i class="ti ti-download"></i> Exportar
    </button>
  </div>

  <div class="card" id="form-producto" style="display:none">
    <strong id="form-producto-titulo" style="display:block;margin-bottom:12px">Nuevo producto</strong>

    <label>Nombre</label>
    <div style="display:flex;gap:8px">
      <input class="input" id="p-nombre" maxlength="80">
      <button class="btn" style="flex-shrink:0" id="btn-escanear-producto" title="Escanear código">
        <i class="ti ti-barcode"></i>
      </button>
    </div>

    <div class="grid grid-2" style="margin-top:12px">
      <div>
        <label>Código (opcional)</label>
        <input class="input" id="p-codigo" maxlength="40">
      </div>
      <div>
        <label>Categoría</label>
        <select class="input" id="p-categoria"></select>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:12px">
      <div>
        <label>Unidad</label>
        <select class="input" id="p-unidad"></select>
      </div>
      <div>
        <label>Precio sugerido (CUP)</label>
        <input class="input" id="p-precio" type="number" min="0" step="0.01">
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:12px">
      <div>
        <label>Costo (CUP, opcional)</label>
        <input class="input" id="p-costo" type="number" min="0" step="0.01">
      </div>
      <div>
        <label>Stock actual</label>
        <input class="input" id="p-stock" type="number" min="0" step="0.01">
      </div>
    </div>

    <label style="margin-top:12px">Stock mínimo (para alertas)</label>
    <input class="input" id="p-stock-minimo" type="number" min="0" step="0.01" value="0">

    <div id="p-margen" style="margin-top:12px;font-size:13px;color:var(--muted)"></div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-success" style="flex:1" id="btn-guardar-producto">
        <i class="ti ti-check"></i> Guardar
      </button>
      <button class="btn" id="btn-cancelar-producto">Cancelar</button>
    </div>
  </div>

  <div class="card" id="form-categoria" style="display:none">
    <strong style="display:block;margin-bottom:12px">Categorías</strong>

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input class="input" id="c-nombre" placeholder="Nombre de la categoría" maxlength="40">
      <button class="btn btn-primary" id="btn-guardar-categoria"><i class="ti ti-plus"></i></button>
    </div>

    <div id="lista-categorias"></div>

    <div style="margin-top:12px">
      <button class="btn btn-block" id="btn-cerrar-categoria">Cerrar</button>
    </div>
  </div>

  <div class="card">
    <input class="input" id="filtro" placeholder="Buscar producto...">
    <div class="grid grid-2" style="margin-top:10px">
      <select class="input" id="filtro-categoria">
        <option value="">Todas las categorías</option>
      </select>
      <select class="input" id="filtro-stock">
        <option value="">Todo el stock</option>
        <option value="bajo">Stock bajo o agotado</option>
        <option value="disponible">Con stock disponible</option>
      </select>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Stock</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>

</main>

<div id="panel" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto">
  <header class="topbar">
    <button class="icon-btn" onclick="cerrarPanel()"><i class="ti ti-arrow-left"></i></button>
    <h1 id="panel-titulo">Producto</h1>
    <div class="spacer"></div>
  </header>
  <main class="container" id="panel-contenido"></main>
</div>

<div id="modal-escanner" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:80;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:400px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <strong>Escanear código</strong>
      <button class="icon-btn" onclick="cerrarEscaner()"><i class="ti ti-x"></i></button>
    </div>
    <video id="video-escanner" style="width:100%;border-radius:10px;background:#000" autoplay playsinline></video>
    <div id="escanner-info" style="margin-top:10px;font-size:13px;color:var(--muted);text-align:center">
      Apunta la cámara al código de barras
    </div>
  </div>
</div>

<nav class="nav-bottom">
  <a href="index.html"><i class="ti ti-shopping-cart"></i>Vender</a>
  <a href="inventario.html"><i class="ti ti-box"></i>Inventario</a>
  <a href="contador.html"><i class="ti ti-cash-banknote"></i>Contador</a>
  <a href="caja.html"><i class="ti ti-wallet"></i>Caja</a>
  <a href="reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a>
  <a href="ajustes.html"><i class="ti ti-settings"></i>Ajustes</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script src="js/db.js"></script>
<script src="js/migracion.js"></script>
<script src="js/app.js"></script>
<script src="js/inventario.js"></script>
</body>
</html>
