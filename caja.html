<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>CajaFácil Cuba — Caja y Turnos</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <i class="ti ti-wallet" style="font-size:22px;color:var(--primary)"></i>
  <h1>Caja y Turnos</h1>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-theme"></button>
</header>

<main class="container">
  <div class="card" id="estado-caja"></div>

  <div class="card" id="panel-abrir">
    <label>Monto inicial en caja (CUP)</label>
    <input class="input" id="monto-inicial" type="number" min="0" value="0">
    <button class="btn btn-primary btn-block" style="margin-top:12px" id="btn-abrir">
      <i class="ti ti-lock-open"></i> Abrir turno
    </button>
  </div>

  <div class="card" id="panel-activo" style="display:none">
    <label>Retiro de caja (sangría)</label>
    <input class="input" id="monto-retiro" type="number" min="0" placeholder="Monto a retirar">
    <input class="input" id="motivo-retiro" placeholder="Motivo (opcional)" style="margin-top:8px">
    <button class="btn btn-block" style="margin-top:12px" id="btn-retiro">
      <i class="ti ti-arrow-down"></i> Registrar retiro
    </button>
    <button class="btn btn-danger btn-block" style="margin-top:12px" id="btn-cerrar">
      <i class="ti ti-lock"></i> Cerrar turno
    </button>
  </div>
</main>

<nav class="nav-bottom">
  <a href="index.html"><i class="ti ti-shopping-cart"></i>Vender</a>
  <a href="inventario.html"><i class="ti ti-box"></i>Inventario</a>
  <a href="contador.html"><i class="ti ti-cash-banknote"></i>Contador</a>
  <a href="caja.html"><i class="ti ti-wallet"></i>Caja</a>
  <a href="reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a>
  <a href="ajustes.html"><i class="ti ti-settings"></i>Ajustes</a>
</nav>

<script src="js/db.js"></script>
<script src="js/migracion.js"></script>
<script src="js/app.js"></script>
<script src="js/caja.js"></script>
</body>
</html>
