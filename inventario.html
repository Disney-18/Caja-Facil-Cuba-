<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>CajaFácil Cuba — Inventario</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <i class="ti ti-box" style="font-size:22px;color:var(--primary)"></i>
  <h1>Inventario</h1>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-theme"></button>
</header>

<main class="container">
  <button class="btn btn-primary btn-block" id="btn-nuevo">
    <i class="ti ti-plus"></i> Nuevo producto
  </button>

  <div class="card" id="form-card" style="display:none;margin-top:12px">
    <div class="grid grid-2">
      <div><label>Nombre</label><input class="input" id="p-nombre"></div>
      <div><label>Código</label><input class="input" id="p-codigo"></div>
      <div><label>Precio (CUP)</label><input class="input" id="p-precio" type="number" min="0" step="0.01"></div>
      <div><label>Stock</label><input class="input" id="p-stock" type="number" min="0"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-success" id="btn-guardar"><i class="ti ti-check"></i> Guardar</button>
      <button class="btn" id="btn-cancelar">Cancelar</button>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <input class="input" id="filtro" placeholder="Filtrar productos...">
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</main>

<nav class="nav-bottom">
  <a href="index.html"><i class="ti ti-shopping-cart"></i>Vender</a>
  <a href="inventario.html"><i class="ti ti-box"></i>Inventario</a>
  <a href="contador.html"><i class="ti ti-cash-banknote"></i>Contador</a>
  <a href="caja.html"><i class="ti ti-wallet"></i>Caja</a>
  <a href="reportes.html"><i class="ti ti-chart-bar"></i>Reportes</a>
  <a href="ajustes.html"><i class="ti ti-settings"></i>Ajustes</a>
</nav>

<script src="js/app.js"></script>
<script src="js/inventario.js"></script>
</body>
</html>
